<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在启动 Store Finder...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    body {
      background: #09090b;
      color: #fafafa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: #dc2626;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 32px;
      box-shadow: 0 10px 25px -5px rgba(220, 38, 38, 0.4);
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #a1a1aa;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #27272a;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #dc2626, #f97316);
      border-radius: 999px;
      position: absolute;
      animation: move 1.5s infinite ease-in-out;
    }
    @keyframes move {
      0% { left: -40%; width: 40%; }
      50% { width: 60%; }
      100% { left: 100%; width: 40%; }
    }
    .status {
      margin-top: 14px;
      font-size: 12px;
      color: #71717a;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">👟</div>
    <h1>Store Finder</h1>
    <p>正在为您极速唤起品牌门店搜索引擎...</p>
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
    <div class="status" id="status-text">正在连接服务 (127.0.0.1:5199)...</div>
  </div>

  <script>
    const targetUrl = 'http://127.0.0.1:5199';
    let attempts = 0;

    async function checkServer() {
      attempts++;
      try {
        const res = await fetch(targetUrl + '/api/v1/health', { cache: 'no-store', mode: 'no-cors' });
        document.getElementById('status-text').innerText = '服务已就绪，正在跳转...';
        setTimeout(() => {
          window.location.replace(targetUrl);
        }, 300);
      } catch (e) {
        if (attempts > 30) {
          window.location.replace(targetUrl);
        } else {
          setTimeout(checkServer, 400);
        }
      }
    }

    setTimeout(checkServer, 300);
  </script>
</body>
</html>
